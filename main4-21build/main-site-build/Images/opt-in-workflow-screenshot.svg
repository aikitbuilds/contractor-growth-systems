<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9f9f9"/>
  
  <!-- Header -->
  <rect x="50" y="30" width="700" height="80" rx="5" fill="#ffffff" stroke="#FF8300" stroke-width="2"/>
  <text x="400" y="75" font-family="Arial" font-size="24" fill="#034694" text-anchor="middle" font-weight="bold">Billion Dollar Contractor - Opt-In Workflow</text>
  
  <!-- Step 1: Form Submission -->
  <rect x="50" y="130" width="700" height="80" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <circle cx="80" cy="170" r="20" fill="#FF8300"/>
  <text x="80" y="177" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1</text>
  <text x="120" y="155" font-family="Arial" font-size="16" fill="#034694" font-weight="bold">Website Form Submission</text>
  <text x="120" y="180" font-family="Arial" font-size="14" fill="#333333">User completes form with clear opt-in checkboxes for email and SMS</text>
  
  <!-- Step 2: Double Opt-In -->
  <rect x="50" y="230" width="700" height="80" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <circle cx="80" cy="270" r="20" fill="#FF8300"/>
  <text x="80" y="277" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">2</text>
  <text x="120" y="255" font-family="Arial" font-size="16" fill="#034694" font-weight="bold">Double Opt-In Confirmation</text>
  <text x="120" y="280" font-family="Arial" font-size="14" fill="#333333">User receives confirmation email and SMS requiring explicit confirmation</text>
  
  <!-- Step 3: User Confirmation -->
  <rect x="50" y="330" width="700" height="80" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <circle cx="80" cy="370" r="20" fill="#FF8300"/>
  <text x="80" y="377" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">3</text>
  <text x="120" y="355" font-family="Arial" font-size="16" fill="#034694" font-weight="bold">User Confirmation</text>
  <text x="120" y="380" font-family="Arial" font-size="14" fill="#333333">User clicks email link and replies "YES" to SMS to complete opt-in</text>
  
  <!-- Step 4: Welcome Message -->
  <rect x="50" y="430" width="700" height="80" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <circle cx="80" cy="470" r="20" fill="#FF8300"/>
  <text x="80" y="477" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">4</text>
  <text x="120" y="455" font-family="Arial" font-size="16" fill="#034694" font-weight="bold">Welcome Message & Unsubscribe Instructions</text>
  <text x="120" y="480" font-family="Arial" font-size="14" fill="#333333">User receives welcome messages with unsubscribe options</text>
  
  <!-- Toll-Free Verification Box -->
  <rect x="200" y="530" width="400" height="50" rx="8" fill="#e8f5e9" stroke="#034694" stroke-width="1"/>
  <text x="400" y="562" font-family="Arial" font-size="18" fill="#034694" text-anchor="middle" font-weight="bold">Toll-Free: 1-888-850-2095</text>
  
  <!-- Connection Lines -->
  <line x1="80" y1="190" x2="80" y2="230" stroke="#dddddd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="80" y1="290" x2="80" y2="330" stroke="#dddddd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="80" y1="390" x2="80" y2="430" stroke="#dddddd" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Text Message Icon -->
  <rect x="650" y="170" width="60" height="40" rx="5" fill="#f0f7ff" stroke="#034694" stroke-width="1"/>
  <text x="680" y="195" font-family="Arial" font-size="12" fill="#034694" text-anchor="middle">SMS</text>
  
  <!-- Email Icon -->
  <rect x="650" y="230" width="60" height="40" rx="5" fill="#f0f7ff" stroke="#034694" stroke-width="1"/>
  <text x="680" y="255" font-family="Arial" font-size="12" fill="#034694" text-anchor="middle">Email</text>
  
  <!-- Footer -->
  <text x="400" y="590" font-family="Arial" font-size="12" fill="#666666" text-anchor="middle">Powered by AI Ninjas - www.aininjas.pro</text>
</svg> 