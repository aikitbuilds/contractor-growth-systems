services:
  - type: web
    name: contractor-growth-systems
    env: node
    buildCommand: npm install && npm run build && mkdir -p dist-server && cp server-prod.js dist-server/server.js && echo '{"type":"module"}' > dist-server/package.json
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROLLUP_NATIVE
        value: 0 